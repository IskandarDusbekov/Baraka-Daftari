{# Telegram profil rasmi; rasm yo'q yoki yuklanmasa — ism bosh harfi. Parametrlar: user, cls (ixtiyoriy), text (ixtiyoriy) #}
<span class="mini-avatar{% if cls %} {{ cls }}{% endif %}">{% firstof text user.display_name|first|upper %}{% if user.photo_url %}<img src="{{ user.photo_url }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">{% endif %}{% if user.is_premium %}<i class="premium-dot" title="Telegram Premium"><svg class="ic"><use href="#i-star"/></svg></i>{% endif %}</span>
