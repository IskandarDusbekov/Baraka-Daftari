# /etc/nginx/sites-available/baraka  ->  ln -s ../sites-available/baraka /etc/nginx/sites-enabled/
# DOMAIN so'zini o'z domeningizga almashtiring (sed -i 's/DOMAIN/baraka.uz/g' ...)
# SSL: sudo certbot --nginx -d DOMAIN -d www.DOMAIN  (certbot 443-blokni o'zi qo'shadi)

# Bitta IP dan haddan tashqari so'rov — bot/hujumdan himoya (Django ichidagi cheklovdan oldingi birinchi qatlam)
limit_req_zone $binary_remote_addr zone=baraka_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=baraka_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=baraka_pages:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=baraka_conn:10m;

server {
    listen 80;
    server_name DOMAIN www.DOMAIN;

    server_tokens off;             # nginx versiyasi ko'rinmasin
    client_max_body_size 1m;       # API kichik JSON, SEO fayl — bir necha bayt
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn baraka_conn 40;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Maxfiy fayllar hech qachon berilmaydi (.env, .git va h.k.)
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(py|pyc|sqlite3|env|log|bak|sql)$ { deny all; return 404; }

    # Statik fayllar nomida xesh bor (ManifestStaticFilesStorage) — uzoq keshlash xavfsiz
    location /static/ {
        alias /srv/baraka/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location /api/ {
        limit_req zone=baraka_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/baraka/gunicorn.sock;
        include /etc/nginx/proxy_params;          # X-Real-IP ni nginx o'zi qo'yadi (Django shunga ishonadi)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Kirish sahifalari: daqiqasiga 10 ta so'rov (parol tanlashdan himoya)
    location ~ ^/(boshqaruv/kirish/|ADMIN_PATH/login/) {
        limit_req zone=baraka_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/baraka/gunicorn.sock;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=baraka_pages burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/baraka/gunicorn.sock;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
